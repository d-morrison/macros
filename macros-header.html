<script>
(function () {
  const macroSources = ["macros.qmd", "macros/macros.qmd"];

  function parseMacros(sourceText) {
    const macros = {};

    for (const rawLine of sourceText.split(/\r?\n/)) {
      const line = rawLine.trim();
      if (!line || line.startsWith("%") || line.startsWith("<!--")) continue;

      let match = line.match(/^\\def\\([^\s{]+)\{(.+)\}\s*$/);
      if (match) {
        const name = match[1];
        const body = match[2];
        const argMatches = [...body.matchAll(/#(\d+)/g)].map((m) => Number(m[1]));
        const argc = argMatches.length ? Math.max(...argMatches) : 0;
        macros[name] = argc > 0 ? [body, argc] : body;
        continue;
      }

      match = line.match(/^\\(?:providecommand|newcommand|renewcommand)\{\\([^}]+)\}(?:\[(\d+)\])?\{(.+)\}\s*$/);
      if (match) {
        const name = match[1];
        const argc = match[2] ? Number(match[2]) : 0;
        const body = match[3];
        macros[name] = argc > 0 ? [body, argc] : body;
      }
    }

    return macros;
  }

  function loadMacroSourceSync() {
    for (const path of macroSources) {
      try {
        const request = new XMLHttpRequest();
        request.open("GET", path, false);
        request.send(null);

        if ((request.status >= 200 && request.status < 300) || request.status === 0) {
          return request.responseText;
        }
      } catch (_) {
        // try next path
      }
    }

    return "";
  }

  const sourceText = loadMacroSourceSync();
  const parsed = parseMacros(sourceText);

  window.MathJax = window.MathJax || {};
  window.MathJax.tex = window.MathJax.tex || {};
  window.MathJax.tex.macros = Object.assign({}, window.MathJax.tex.macros || {}, parsed);

  window.MathJax.TeX = window.MathJax.TeX || {};
  window.MathJax.TeX.Macros = Object.assign({}, window.MathJax.TeX.Macros || {}, parsed);

  if (window.MathJax.Hub && window.MathJax.Hub.Config) {
    window.MathJax.Hub.Config({ TeX: { Macros: window.MathJax.TeX.Macros } });
  }
})();
</script>
